name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish Packages
    runs-on: ubuntu-latest
    environment: main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exit pre-release mode
        run: |
          if [ -f .changeset/pre.json ]; then
            npx changeset pre exit
            git add .changeset/pre.json
            git commit -m "chore: exit pre-release mode [skip ci]"
          fi

      - name: Version packages
        run: npx changeset version

      - name: Push version bumps
        run: git push

      - name: Re-install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Publish packages
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        run: git push --follow-tags

      - name: Create GitHub release
        # Packages are versioned independently (no single repo version), so the
        # release is keyed off the curated notes doc that the release/{date} PR
        # adds under docs/releases/. We pick the doc from the most recent commit
        # that touched docs/releases (the merged release PR) rather than the
        # current date, since a release/{date} branch may merge on a later day.
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          NOTES=$(git log -1 --pretty=format: --name-only -- docs/releases \
            | grep -E '^docs/releases/.+\.md$' | head -n1)

          if [ -z "$NOTES" ] || [ ! -f "$NOTES" ]; then
            echo "::warning::No release notes found under docs/releases/; skipping GitHub release."
            exit 0
          fi

          NAME=$(basename "$NOTES" .md)   # e.g. 2026-05-09
          TAG="release-${NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          echo "Creating GitHub release $TAG from $NOTES"
          gh release create "$TAG" --title "Release ${NAME}" --notes-file "$NOTES"

      - name: Sync version bumps to staging and develop
        run: |
          for branch in staging develop; do
            git fetch origin $branch
            git checkout $branch
            git merge main --no-edit -X theirs
            git push origin $branch
          done
